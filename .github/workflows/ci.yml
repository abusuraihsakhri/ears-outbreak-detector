name: EARS Outbreak Detector CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q ears.py cli.py agents enrichment.py simulator.py
      - name: Run complete Python test suite
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Test browser detector
        run: node --test web/test-app.js

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependency requirements
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
